<meta charset="UTF-8">
<title>Walmart Navbar</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<nav class="navbar navbar-expand-lg navbar-walmart">
  <div class="container-fluid d-flex align-items-center justify-content-between">
    <!-- Walmart Logo -->
    <img src="https://cdn.worldvectorlogo.com/logos/walmart-2.svg" alt="Walmart Logo" style="height: 35px; margin-right: 10px;" />

    <!-- Location Selector -->
    <div class="location-box me-3">
      <i class="bi bi-geo-alt-fill"></i>
      <div>
        <strong>How do you want your items?</strong><br>
        <small>Centreville, 20120 • Chantilly Supercen...</small>
      </div>
    </div>

    <!-- Search Bar -->
    <div class="search-wrapper me-3 flex-grow-1">
      <input type="text" class="form-control search-bar" placeholder="Search everything at Walmart online and in store">
      <i class="bi bi-search px-2"></i>
    </div>

    <!-- Menu Items -->
    <div class="d-flex align-items-center gap-4">
      <a class="nav-link" href="#"><i class="bi bi-heart"></i> <strong>My Items</strong></a>
      <a class="nav-link" href="#"><i class="bi bi-person"></i> <strong>Account</strong></a>
      <a class="nav-link cart" href="#">
        <i class="bi bi-cart3 cart-icon"></i> $0.00
      </a>
    </div>
  </div>
</nav>

<!-- Bootstrap Icons and JS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
